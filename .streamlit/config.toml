[client]
toolbarMode = "viewer"
showSidebarNavigation = false

[server]
headless = true
enableStaticServing = true

[browser]
gatherUsageStats = false

# ---- هوية بصرية سريرية: ألوان هادئة عالية التباين، وخط عربي واضح (IBM Plex Sans Arabic، رخصة OFL) ----
[theme]
base = "light"
primaryColor = "#0E6E74"
backgroundColor = "#F4F6F9"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1B2D"
borderColor = "#E2E8F0"
linkColor = "#0E6E74"
font = "Plex Arabic"
headingFont = "Plex Arabic"
baseFontSize = 15
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
dataframeHeaderBackgroundColor = "#F1F5F9"
redColor = "#B42318"
orangeColor = "#B54708"
greenColor = "#067647"
blueColor = "#175CD3"

[theme.sidebar]
backgroundColor = "#0F2A3A"
secondaryBackgroundColor = "#16384C"
textColor = "#E6EEF3"
primaryColor = "#5CC8C2"
borderColor = "#1F4A62"

[[theme.fontFaces]]
family = "Plex Arabic"
url = "app/static/fonts/plex-arabic-400.woff2"
weight = 400
unicodeRange = "U+0600-06FF, U+0750-077F, U+0870-088E, U+0890-0891, U+0898-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC"

